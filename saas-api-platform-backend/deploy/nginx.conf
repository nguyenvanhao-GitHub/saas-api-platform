user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zone for Nginx Layer Protection
    limit_req_zone $binary_remote_addr zone=api_gateway:10m rate=100r/m;

    # 1. Reverse Proxy for Spring Boot Backend API
    server {
        listen 80;
        server_name api.yourdomain.com;

        location / {
            limit_req zone=api_gateway burst=20 nodelay;
            proxy_pass http://saas_api_app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 2. Static Web Hosting for Angular 18 Frontend
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;

        root /usr/share/nginx/html;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public";
        }
    }
}
